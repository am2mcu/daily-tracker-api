services:
  api:
    image: ${IMAGE_NAME}
    container_name: daily-tracker-api
    expose:
      - "80"
    environment:
      PORT: 80
      DB_URI: mongodb://mongo:27017/daily-tracker
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
    restart: unless-stopped
    networks:
      - shared-mongo
      - proxy

networks:
  proxy:
    external: true
  shared-mongo:
    external: true
