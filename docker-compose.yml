services:
  migrate:
    image: ${IMAGE_NAME}
    container_name: daily-tracker-api-migration
    command: npm run migrate
    environment:
      MONGODB_URI: mongodb://mongo:27017/daily-tracker
    restart: "no"
    networks:
      - shared-mongo

  api:
    image: ${IMAGE_NAME}
    container_name: daily-tracker-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "80"
    environment:
      PORT: 80
      MONGODB_URI: mongodb://mongo:27017/daily-tracker
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_SENDER: ${EMAIL_SENDER}
    restart: unless-stopped
    networks:
      - shared-mongo
      - proxy

networks:
  proxy:
    external: true
  shared-mongo:
    external: true
